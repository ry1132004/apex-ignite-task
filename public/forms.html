<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="product"><option value="">General inquiry</option></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="quote" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input name="name" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="product"><option value="">General inquiry</option></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
